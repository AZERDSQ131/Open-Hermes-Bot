name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push makes the run before it pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the code.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests and build
    # The checks are platform-independent: the typecheck, the tests and the
    # renderer build say the same thing on Linux as on macOS, and the Linux
    # runners are a far bigger pool — a push does not wait for a Mac to be
    # free. The Mac is where the app is built, and that is the release
    # workflow's job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the code out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck the main process
        run: npm run typecheck:electron

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage
