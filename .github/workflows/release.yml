name: Release

# A tag is a version: v1.0.0 on main publishes the app.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check the code out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the app and publish it
        env:
          # The token that lets the build attach the files to the release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish
