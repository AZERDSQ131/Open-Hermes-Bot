name: Question
description: A question about the connection, the models or the settings
labels: ["question"]
body:
  - type: dropdown
    id: topic
    attributes:
      label: What is it about
      options:
        - The connection to Hermes
        - The models, the picker or the quota
        - The groups
        - The dictation or the files
        - Something else
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
